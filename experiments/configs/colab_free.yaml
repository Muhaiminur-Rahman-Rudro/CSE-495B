# Google Colab Free Configuration
# Lightweight defaults for free-tier GPU sessions

models:
  - qwen2.5-3b

prompting_strategies:
  - direct
  - cot

decoding_strategies:
  - greedy
  - top_p

datasets:
  - gsm8k

# Colab free-tier friendly settings
quantization: "4bit"
max_samples: 30
split: test
seed: 42
output_dir: results/colab_free

# Keep generation short to avoid OOM/timeouts
max_new_tokens: 256

# Decoding settings
num_beams: 3
top_k: 40
top_p: 0.9
temperature: 0.7

# Prompting settings (reduced tree complexity)
use_few_shot: false
tot_num_branches: 2
tot_max_depth: 2
reflexion_max_iterations: 2
tog_num_hypotheses: 2
tog_max_depth: 3
tog_exploration_width: 2
